# TEMPLATE, NOT YET RUN ON GITHUB. Syntax-checked only; test in a scratch repo first.
# Copy to .github/workflows/claude-pr-review.yml in YOUR repo (not this one).
# Based on the documented code-review plugin workflow, plus cost/timeout/concurrency
# guards and a failure ping. Docs: https://code.claude.com/docs/en/github-actions
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time; a new push cancels the stale review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and fork PRs (forks get no secrets on public repos anyway).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with code-review plugin
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "no webhook configured"; exit 0; fi
          payload=$(jq -n --arg t "Claude review failed on PR #$PR: $RUN_URL" '{text:$t}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"
