# Copy to .github/workflows/prompt-evals.yml in YOUR repo (not this playbook).
# Assumed layout: prompts/support.md, evals/cases.jsonl, evals/baseline.json,
# evals/golden_outputs.jsonl (approved replies, {"id","output"} per line), evals/requirements.txt,
# evals/run_evals.py (from this folder), plugins/my-plugin/ with an evals/ suite.
# Secret: ANTHROPIC_API_KEY (use a dedicated key in its own workspace so the
# Usage API can attribute eval spend separately).
name: prompt-evals

on:
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "plugins/**"
  workflow_dispatch: {}

concurrency:
  group: prompt-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free-checks:
    # Code graders over committed golden outputs: no model calls, runs on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: |
          python evals/run_evals.py --system prompts/support.md --cases evals/cases.jsonl \
            --replay evals/golden_outputs.jsonl --no-judge --out free.json

  prompt-regression:
    needs: free-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin to the SDK version you tested locally, e.g. -r evals/requirements.txt.
      - run: pip install -r evals/requirements.txt
      - name: Run evals (pinned models) and diff against baseline
        run: |
          python evals/run_evals.py --system prompts/support.md --cases evals/cases.jsonl \
            --model claude-sonnet-5-5 --judge-model claude-opus-5-5 --votes 3 \
            --baseline evals/baseline.json --tolerance 0.02 --out results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-eval-results
          path: results.json

  plugin-evals:
    needs: free-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code (stable channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sandbox deps (needed if any case is granted Bash)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: claude plugin eval
        working-directory: plugins/my-plugin
        run: |
          claude plugin eval . \
            --trust-plugin \
            --json results.json \
            --threshold 0.8 \
            --model claude-sonnet-5-5 \
            --judge-model claude-sonnet-5-5 \
            --no-publish \
            --max-cost-usd 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-eval-results
          path: |
            plugins/my-plugin/results.json
            plugins/my-plugin/evals/results/
